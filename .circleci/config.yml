version: 2.1

orbs:
  android: circleci/android@2.4.0

jobs:
  build-apk:
    executor:
      name: android/android-machine
      resource-class: large
      tag: 2024.04.1
    steps:
      - checkout

      - run:
          name: Set Node version
          command: |
            nvm install 20
            nvm use 20
            node --version
            npm --version

      - run:
          name: Install dependencies
          command: |
            nvm use 20
            npm install --legacy-peer-deps

      - run:
          name: Accept SDK licenses
          command: |
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - run:
          name: Build APK
          command: |
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon 2>&1

      - store_artifacts:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          destination: Tighremt-debug.apk

workflows:
  build:
    jobs:
      - build-apk:
          filters:
            branches:
              only: main
