version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.01-node
    resource_class: medium
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}

      - run:
          name: Install Node dependencies
          command: npm ci

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

      - run:
          name: Sync Capacitor
          command: npx cap sync android

      - run:
          name: Build debug APK
          command: |
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace

      - store_artifacts:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          destination: Tighremt-debug.apk

workflows:
  build:
    jobs:
      - build-apk:
          filters:
            branches:
              only: main
