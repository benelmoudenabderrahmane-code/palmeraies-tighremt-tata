version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.01-node
    resource_class: medium

    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-v2-{{ checksum "package.json" }}

      - run:
          name: Install Node dependencies
          command: npm install --legacy-peer-deps

      - save_cache:
          key: npm-v2-{{ checksum "package.json" }}
          paths:
            - node_modules

      - run:
          name: Accept Android SDK licenses + install SDK 35
          command: |
            yes | sdkmanager --licenses 2>/dev/null || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - run:
          name: Check Java version
          command: java -version && echo "JAVA_HOME=$JAVA_HOME"

      - run:
          name: Build debug APK
          command: |
            cd android
            chmod +x gradlew
            export JAVA_OPTS="-Xmx2g"
            export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"
            ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tail -100

      - store_artifacts:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          destination: Tighremt-debug.apk

workflows:
  build:
    jobs:
      - build-apk:
          filters:
            branches:
              only: main
