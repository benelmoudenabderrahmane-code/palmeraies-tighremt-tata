version: 2.1

jobs:
  build-apk:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout

      - run:
          name: Setup Java 17
          command: |
            sudo apt-get update -q
            sudo apt-get install -y openjdk-17-jdk
            java -version

      - run:
          name: Setup Node 20
          command: |
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
            node --version && npm --version

      - run:
          name: Install Android SDK
          command: |
            set +e
            cd ~
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mkdir -p ~/android-sdk/cmdline-tools
            mv cmdline-tools ~/android-sdk/cmdline-tools/latest
            echo "export ANDROID_HOME=$HOME/android-sdk" >> $BASH_ENV
            echo "export ANDROID_SDK_ROOT=$HOME/android-sdk" >> $BASH_ENV
            echo "export PATH=\$PATH:$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools" >> $BASH_ENV
            source $BASH_ENV
            printf 'y\n%.0s' {1..20} | sdkmanager --licenses > /dev/null 2>&1
            sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1
            echo "Android SDK installed"
            set -e

      - run:
          name: Install npm dependencies
          command: npm install --legacy-peer-deps

      - run:
          name: Build debug APK
          command: |
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            export ANDROID_HOME=$HOME/android-sdk
            export ANDROID_SDK_ROOT=$HOME/android-sdk
            export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
            echo "=== Environment Check ==="
            java -version
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls $ANDROID_HOME/platforms/ 2>&1 || echo "No platforms dir"
            echo "=== Node modules check ==="
            ls node_modules/@capacitor/android/ 2>&1 | head -5 || echo "Capacitor not in node_modules"
            echo "=== Building ==="
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 || true
            echo "Exit: $?"

      - store_artifacts:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          destination: Tighremt-debug.apk

workflows:
  build:
    jobs:
      - build-apk:
          filters:
            branches:
              only: main
