version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.01-node
    resource_class: medium

    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-v2-{{ checksum "package.json" }}

      - run:
          name: Install Node dependencies
          command: npm install --legacy-peer-deps

      - save_cache:
          key: npm-v2-{{ checksum "package.json" }}
          paths:
            - node_modules

      - run:
          name: Install Android SDK 35
          command: |
            yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - run:
          name: Sync Capacitor
          command: ./node_modules/.bin/cap sync android

      - run:
          name: Build debug APK
          command: |
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace

      - store_artifacts:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          destination: Tighremt-debug.apk

workflows:
  build:
    jobs:
      - build-apk:
          filters:
            branches:
              only: main
